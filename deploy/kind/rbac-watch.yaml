# CA-P2-004f: the watch collector's identity, used only by the collector-watch-kind CI job.
# Identical to rbac.yaml (CA-P2-004e) except that the Role adds `watch` beside get and list on the
# same four resources in ca-demo. Nothing else changes.
# Deliberately absent: configmaps, secrets, every subresource (exec, log, attach, portforward, proxy,
# status, scale), every write verb, every other namespace, every cluster-scoped resource, any
# ClusterRole(Binding), token requests. An open watch outlives a revoked binding until its
# timeoutSeconds or the token's expiry; the resume after a revocation is refused (tested in CI).
apiVersion: v1
kind: Namespace
metadata: {name: ca-collector}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ca-collector, namespace: ca-collector}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ca-collector-watch, namespace: ca-demo}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ca-collector-watch, namespace: ca-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ca-collector-watch}
subjects:
  - {kind: ServiceAccount, name: ca-collector, namespace: ca-collector}
