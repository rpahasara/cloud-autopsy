# CA-SPIKE-001 offline checks. Synthetic fixtures only: no secrets, no cloud or cluster
# credentials, no model calls and no deployment. Actions are pinned to full commit SHAs.
name: spike-ci

on:
  push:
    # main: every integrated state is checked by the same jobs as the pull requests.
    branches: [main, spike/ca-scenario-001]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Unit tests
        run: python -I -m unittest discover -s prototype/tests -t prototype -v

      - name: Fixture and truth-pin verification
        run: python -I prototype/cli.py verify-fixtures

      - name: Documentation validators
        run: |
          python -I tools/validate_docs.py
          python -I tools/validate_phase1c.py
          python -I tools/validate_phase1d.py

      - name: Supply-chain policy checks (CA-P2-001, offline)
        run: |
          python -I -m unittest discover -s tools/supply_chain -t tools/supply_chain -v
          python -I tools/supply_chain/supply_chain.py check

      - name: Contract tests (CA-P2-002a-d)
        run: python -I -m unittest discover -s tests/contracts -t tests/contracts -v

      - name: Engine tests (CA-P2-005a, pure, no database)
        run: python -I -m unittest discover -s tests/engine -t tests/engine -v

      - name: Local API tests (CA-P2-006b, no database; HTTP on 127.0.0.1 only)
        run: python -I -m unittest discover -s tests/api -t tests/api -v

      - name: Evidence bundle tests (CA-P2-004a, offline, no database)
        run: python -I -m unittest discover -s tests/app -t tests/app -v

      - name: Collector tests (CA-P2-004e, offline, fake TLS API server on 127.0.0.1)
        env:
          CA_COLLECTOR_TLS_REQUIRE: "1"
        run: python -I -m unittest discover -s tests/collector -t tests/collector -v

      - name: Example bundles investigate offline (CA-P2-004a)
        run: python -I tools/create_investigation.py --offline examples/bundles/*

      - name: Recorded Kubernetes examples convert and investigate offline (CA-P2-004c)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/k8s"
          for rec in examples/k8s-recordings/*; do
            name="$(basename "$rec")"
            python -I tools/convert_k8s_recording.py "$rec" --out "$RUNNER_TEMP/k8s/$name" --report "$RUNNER_TEMP/k8s/$name.report.json"
          done
          for rec in examples/k8s-recordings/snapshot-*; do  # CA-P2-004d: observation kinds 0.2
            name="$(basename "$rec")-kinds-0.2"
            python -I tools/convert_k8s_recording.py "$rec" --kinds 0.2 --out "$RUNNER_TEMP/k8s/$name" --report "$RUNNER_TEMP/k8s/$name.report.json"
          done
          python -I tools/create_investigation.py --offline "$RUNNER_TEMP"/k8s/*/

      # The job's first (cold) browser launch, then repeated and concurrent launches, through the same
      # harness the browser tests use. Every failed or retried launch is printed; none is hidden.
      - name: Browser startup stress (headless Chrome, 127.0.0.1 only)
        env:
          CA_BROWSER_NO_SANDBOX: "1"
        run: python -I tests/browser/startup_stress.py --sequential 20 --concurrency 4 --rounds 3

      # CA-P2-006c: the read-only dashboard in the runner's preinstalled Chrome (headless, temporary
      # profile, DevTools on 127.0.0.1), served by the real API with the labelled synthetic preview.
      # The sandbox is disabled only because hosted runners may forbid its user namespaces; the
      # browser loads nothing but the loopback page under test.
      - name: Dashboard browser tests (CA-P2-006c, headless Chrome, 127.0.0.1 only)
        env:
          CA_BROWSER_REQUIRE: "1"
          CA_BROWSER_NO_SANDBOX: "1"
        run: python -I -m unittest discover -s tests/browser -t tests/browser -v

      - name: Demo self-checks
        run: python -I prototype/cli.py demo

  # CA-P2-003b-1: integration tests against a real, disposable, synthetic-only PostgreSQL 18.6.
  # Pre-gate development authorization only. The database listens on loopback, uses temporary
  # storage, runs without capabilities and is removed after the job. Credentials are random per
  # run and never leave the runner. Network use: PyPI (hash-locked install) and Docker Hub (digest pull).
  db-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the hash-locked database driver tree
        run: |
          python -m venv .venv-db
          .venv-db/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: -r requirements-db.txt
          .venv-db/bin/python -W error::DeprecationWarning -c "import pg8000.native, scramp, asn1crypto.x509, dateutil.parser"

      - name: Start disposable PostgreSQL (digest-pinned, loopback only)
        run: |
          umask 077
          secret_dir="$(mktemp -d)"
          python -c "import secrets; print(secrets.token_urlsafe(32), end='')" > "$secret_dir/bootstrap_password"
          chmod 0644 "$secret_dir/bootstrap_password"
          echo "CA_PG_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          CA_PG_SECRET_DIR="$secret_dir" docker compose -f db/test/compose.yaml up -d --wait

      - name: Check the credential boundary (no secret values printed)
        run: |
          set -eu
          test "$(stat -c '%a' "$CA_PG_SECRET_DIR")" = 700
          test "$(stat -c '%a' "$CA_PG_SECRET_DIR/bootstrap_password")" = 644
          cid="$(docker compose -f db/test/compose.yaml ps -q postgres)"
          docker inspect "$cid" --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/ca_bootstrap_password"}}{{.Type}} rw={{.RW}}{{end}}{{end}}' | tee /dev/stderr | grep -qx 'bind rw=false'
          docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^POSTGRES_PASSWORD_FILE=/run/secrets/ca_bootstrap_password$'
          ! docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^POSTGRES_PASSWORD='
          docker inspect "$cid" --format '{{json .HostConfig.PortBindings}}' | tee /dev/stderr | grep -q '"HostIp":"127.0.0.1"'
          echo "secret dir 0700, bootstrap file 0644 inside it, read-only bind mount, password passed by file only, loopback port"

      - name: Database integration tests (real PostgreSQL)
        env:
          CA_PG_REQUIRE: "1"
          CA_BROWSER_REQUIRE: "1"
          CA_BROWSER_NO_SANDBOX: "1"
        run: .venv-db/bin/python -I -m unittest discover -s tests/integration -t tests/integration -v

      # The demo databases take a free 127.0.0.1 port chosen by Docker (port 0): fixed ports inside
      # the runner's ephemeral range could still be held by the integration tests' client sockets.
      - name: One-command investigation demo (CA-P2-005a/006a, its own disposable database)
        env:
          CA_PG_DEMO_PORT: "0"
        run: .venv-db/bin/python -I tools/investigation_demo.py --out "$RUNNER_TEMP/ca-p2-006a"

      - name: One-command local API demo (CA-P2-006b, its own disposable database, 127.0.0.1 only)
        env:
          CA_PG_DEMO_PORT: "0"
        run: .venv-db/bin/python -I tools/api_demo.py --out "$RUNNER_TEMP/ca-p2-006b"

      - name: Remove the disposable database
        if: always()
        run: |
          CA_PG_SECRET_DIR="${CA_PG_SECRET_DIR:-/nonexistent}" docker compose -f db/test/compose.yaml down -v --remove-orphans || true
          rm -rf "${CA_PG_SECRET_DIR:-/nonexistent}"

  # CA-P2-004e: the read-only collector against a disposable kind cluster created and deleted in this
  # job only (synthetic workloads; never a real, shared or existing cluster). Tools are pinned and
  # checksum-verified, the node and workload images are digest-pinned and inventoried. The collector
  # uses a 10-minute ServiceAccount token with get/list on four resources in one namespace. Network
  # use: GitHub releases and dl.k8s.io (pinned binaries), registry images by digest, PyPI (hash-locked)
  # and Docker Hub (digest-pinned PostgreSQL) for the database-verified replay.
  collector-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      SA: system:serviceaccount:ca-collector:ca-collector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run only when collector paths changed (or on manual dispatch)
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(src/cloud_autopsy/collector/|src/cloud_autopsy/app/k8s_recording\.py|deploy/kind/|tools/collect_k8s\.py|tests/collector/|tests/kind/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Download pinned kind and kubectl and verify their SHA-256
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          bin="$RUNNER_TEMP/ca-bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum -c -
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $bin/kubectl" | sha256sum -c -
          chmod 0755 "$bin/kind" "$bin/kubectl"
          echo "KIND=$bin/kind" >> "$GITHUB_ENV"
          echo "KUBECTL=$bin/kubectl" >> "$GITHUB_ENV"
          echo "CLUSTER=ca-collector-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/ca-admin.kubeconfig" >> "$GITHUB_ENV"

      - name: Create the disposable cluster (127.0.0.1 only, digest-pinned node image)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          "$KIND" create cluster --name "$CLUSTER" --config deploy/kind/cluster.yaml --wait 180s \
            || { "$KIND" delete cluster --name "$CLUSTER" || true; "$KIND" create cluster --name "$CLUSTER" --config deploy/kind/cluster.yaml --wait 180s; }
          "$KUBECTL" config view -o jsonpath='{.clusters[0].cluster.server}' | grep -Eq '^https://127\.0\.0\.1:[0-9]+$'

      - name: Synthetic workloads, a rollout and failing containers (for Events)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          "$KUBECTL" apply -f deploy/kind/workloads.yaml
          "$KUBECTL" -n ca-demo rollout status deployment/checkout-api --timeout=180s
          "$KUBECTL" apply -f deploy/kind/checkout-api-v2.yaml
          "$KUBECTL" -n ca-demo rollout status deployment/checkout-api --timeout=180s
          for i in $(seq 1 60); do
            n="$("$KUBECTL" -n ca-demo get events --field-selector type=Warning -o name | wc -l)"
            [ "$n" -ge 1 ] && break
            sleep 2
          done
          "$KUBECTL" -n ca-demo get deployments,replicasets,pods -o wide

      - name: Collector identity (namespace-restricted Role) and a 10-minute token outside Git
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/ca-collector-cred.XXXXXX")"
          "$KUBECTL" apply -f deploy/kind/rbac.yaml
          "$KUBECTL" create token ca-collector -n ca-collector --duration=10m > "$dir/token"
          echo "::add-mask::$(cat "$dir/token")"
          "$KUBECTL" config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "$dir/ca.crt"
          printf 'bogus-token-%064d' 0 > "$dir/bad-token"
          echo "CRED=$dir" >> "$GITHUB_ENV"
          echo "SERVER=$("$KUBECTL" config view -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_ENV"
          test "$(stat -c '%a' "$dir")" = 700 && test "$(stat -c '%a' "$dir/token")" = 600

      - name: Negative RBAC (kubectl auth can-i as the collector)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          no() { out="$("$KUBECTL" auth can-i "$@" --as="$SA" 2>/dev/null || true)"; [ "$out" = "no" ] || { echo "FAIL: can-i $* -> $out"; exit 1; }; }
          yes() { out="$("$KUBECTL" auth can-i "$@" --as="$SA" 2>/dev/null || true)"; [ "$out" = "yes" ] || { echo "FAIL: can-i $* -> $out"; exit 1; }; }
          yes list pods -n ca-demo
          yes list events -n ca-demo
          yes list deployments.apps -n ca-demo
          yes list replicasets.apps -n ca-demo
          for r in secrets configmaps; do no get "$r" -n ca-demo; no list "$r" -n ca-demo; done
          no watch pods -n ca-demo
          # Subresources need --subresource: "pods/log" alone would mean a pod named "log".
          no create pods --subresource=exec -n ca-demo
          no get pods --subresource=log -n ca-demo
          no create pods --subresource=portforward -n ca-demo
          no get pods --subresource=proxy -n ca-demo
          no get deployments.apps --subresource=scale -n ca-demo
          no update deployments.apps --subresource=status -n ca-demo
          for v in create update patch delete deletecollection; do
            no "$v" pods -n ca-demo; no "$v" deployments.apps -n ca-demo; no "$v" replicasets.apps -n ca-demo
          done
          no list pods -n ca-other
          no list nodes
          no get namespaces
          no create serviceaccounts --subresource=token -n ca-collector
          echo "can-i: every forbidden verb/resource is 'no'; the four permitted lists are 'yes'"

      - name: Negative RBAC with the real token (raw requests must get 403)
        if: steps.paths.outputs.run == 'true'
        run: python -I tests/kind/kind_checks.py rbac --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token"

      - name: Collect, convert and investigate offline (fail-closed, abstains)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          python -I tools/collect_k8s.py --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" \
            --namespace ca-demo --cluster-id ca-kind-synthetic --recording-id ca-kind-collect --out "$RUNNER_TEMP/run-ok" --page-limit 5 --max-pages 100
          python -I tests/kind/kind_checks.py run --out "$RUNNER_TEMP/run-ok" --token-file "$CRED/token" --expect consistent
          python -I tools/create_investigation.py --offline "$RUNNER_TEMP/run-ok/bundle"

      - name: Install the hash-locked database driver tree
        if: steps.paths.outputs.run == 'true'
        run: |
          python -m venv .venv-db
          .venv-db/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: -r requirements-db.txt

      - name: Database-verified replay of the collected bundle (its own disposable PostgreSQL)
        if: steps.paths.outputs.run == 'true'
        env:
          CA_PG_DEMO_PORT: "0"
        run: |
          set -eu
          .venv-db/bin/python -I tools/create_investigation.py "$RUNNER_TEMP/run-ok/bundle" --json > "$RUNNER_TEMP/db.json"
          python -I tests/kind/kind_checks.py db --json "$RUNNER_TEMP/db.json"

      - name: Faults become gaps (page bound, bad token, closed port, revoked binding)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          c() { python -I tools/collect_k8s.py --ca-file "$CRED/ca.crt" --namespace ca-demo --cluster-id ca-kind-synthetic "$@"; }
          c --server "$SERVER" --token-file "$CRED/token" --recording-id ca-kind-trunc --out "$RUNNER_TEMP/run-trunc" --page-limit 1 --max-pages 1
          python -I tests/kind/kind_checks.py run --out "$RUNNER_TEMP/run-trunc" --token-file "$CRED/token" --expect truncated
          c --server "$SERVER" --token-file "$CRED/bad-token" --recording-id ca-kind-badtoken --out "$RUNNER_TEMP/run-badtoken"
          python -I tests/kind/kind_checks.py run --out "$RUNNER_TEMP/run-badtoken" --token-file "$CRED/token" --expect denied
          c --server "https://127.0.0.1:9" --token-file "$CRED/token" --recording-id ca-kind-closed --out "$RUNNER_TEMP/run-closed"
          python -I tests/kind/kind_checks.py run --out "$RUNNER_TEMP/run-closed" --token-file "$CRED/token" --expect unavailable
          "$KUBECTL" -n ca-demo delete rolebinding ca-collector-read
          c --server "$SERVER" --token-file "$CRED/token" --recording-id ca-kind-revoked --out "$RUNNER_TEMP/run-revoked"
          python -I tests/kind/kind_checks.py run --out "$RUNNER_TEMP/run-revoked" --token-file "$CRED/token" --expect denied

      - name: Delete the cluster and the credentials
        if: always() && steps.paths.outputs.run == 'true'
        run: |
          "${KIND:-kind}" delete cluster --name "${CLUSTER:-none}" || true
          rm -rf "${CRED:-/nonexistent}" "$RUNNER_TEMP"/run-* "$RUNNER_TEMP/db.json"
          if docker ps --format '{{.Names}}' | grep -q "${CLUSTER:-none}"; then echo "FAIL: cluster container left behind"; exit 1; fi

  # CA-P2-004f: the list + watch collector against its own disposable kind cluster, created and deleted
  # in this job only (synthetic workloads; never a real, shared or existing cluster). Same pinned,
  # checksum-verified tools and digest-pinned images as collector-kind. The collector's Role adds only
  # `watch` (deploy/kind/rbac-watch.yaml); its 30-minute token lives in a 0700 temp directory.
  # Optional: not a required check on main. Network use as collector-kind.
  collector-watch-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      SA: system:serviceaccount:ca-collector:ca-collector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run only when collector or contract paths changed (or on manual dispatch)
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(src/cloud_autopsy/collector/|src/cloud_autopsy/app/k8s_(watch_)?recording\.py|src/cloud_autopsy/contracts/|src/cloud_autopsy/db/migrations/|deploy/kind/|tools/collect_k8s\.py|tests/collector/|tests/kind/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Download pinned kind and kubectl and verify their SHA-256
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          bin="$RUNNER_TEMP/ca-bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum -c -
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $bin/kubectl" | sha256sum -c -
          chmod 0755 "$bin/kind" "$bin/kubectl"
          echo "KIND=$bin/kind" >> "$GITHUB_ENV"
          echo "KUBECTL=$bin/kubectl" >> "$GITHUB_ENV"
          echo "CLUSTER=ca-watch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/ca-admin.kubeconfig" >> "$GITHUB_ENV"

      - name: Create the disposable cluster (127.0.0.1 only, digest-pinned node image)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          "$KIND" create cluster --name "$CLUSTER" --config deploy/kind/cluster.yaml --wait 180s \
            || { "$KIND" delete cluster --name "$CLUSTER" || true; "$KIND" create cluster --name "$CLUSTER" --config deploy/kind/cluster.yaml --wait 180s; }
          "$KUBECTL" config view -o jsonpath='{.clusters[0].cluster.server}' | grep -Eq '^https://127\.0\.0\.1:[0-9]+$'

      - name: Synthetic workloads
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          "$KUBECTL" apply -f deploy/kind/workloads.yaml
          "$KUBECTL" -n ca-demo rollout status deployment/checkout-api --timeout=180s
          "$KUBECTL" -n ca-demo get deployments,replicasets,pods -o wide

      - name: Watch collector identity (Role adds only watch) and a 30-minute token outside Git
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/ca-collector-cred.XXXXXX")"
          "$KUBECTL" apply -f deploy/kind/rbac-watch.yaml
          "$KUBECTL" create token ca-collector -n ca-collector --duration=30m > "$dir/token"
          echo "::add-mask::$(cat "$dir/token")"
          "$KUBECTL" config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "$dir/ca.crt"
          echo "CRED=$dir" >> "$GITHUB_ENV"
          echo "SERVER=$("$KUBECTL" config view -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_ENV"
          test "$(stat -c '%a' "$dir")" = 700 && test "$(stat -c '%a' "$dir/token")" = 600

      - name: Negative RBAC (kubectl auth can-i as the collector)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          no() { out="$("$KUBECTL" auth can-i "$@" --as="$SA" 2>/dev/null || true)"; [ "$out" = "no" ] || { echo "FAIL: can-i $* -> $out"; exit 1; }; }
          yes() { out="$("$KUBECTL" auth can-i "$@" --as="$SA" 2>/dev/null || true)"; [ "$out" = "yes" ] || { echo "FAIL: can-i $* -> $out"; exit 1; }; }
          for r in pods events deployments.apps replicasets.apps; do yes list "$r" -n ca-demo; yes watch "$r" -n ca-demo; done
          for r in secrets configmaps; do no get "$r" -n ca-demo; no list "$r" -n ca-demo; no watch "$r" -n ca-demo; done
          no watch pods -n ca-other
          no watch deployments.apps -n ca-other
          no watch pods --all-namespaces
          no watch events --all-namespaces
          no watch nodes
          no watch namespaces
          no get pods -n ca-demo --subresource=log
          no create pods -n ca-demo --subresource=exec
          no create pods -n ca-demo --subresource=portforward
          no get deployments.apps -n ca-demo --subresource=scale
          for v in create update patch delete deletecollection; do
            no "$v" pods -n ca-demo; no "$v" deployments.apps -n ca-demo; no "$v" replicasets.apps -n ca-demo
          done
          no list nodes
          no get namespaces
          no create serviceaccounts/token -n ca-collector
          echo "can-i: the four list+watch grants are 'yes'; every other verb, resource, namespace and scope is 'no'"

      - name: Negative RBAC with the real token (raw requests must get 403; the permitted watch 200)
        if: steps.paths.outputs.run == 'true'
        run: python -I tests/kind/kind_checks.py rbac --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" --watch-role

      - name: "Run 1: a watch session while the cluster changes (rollout, scale, crash loop)"
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          c() { python -I tools/collect_k8s.py --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" --namespace ca-demo --cluster-id ca-kind-synthetic "$@"; }
          c --recording-id ca-watch-run1 --out "$RUNNER_TEMP/run-watch1" --watch-seconds 150 --probe-interval 5 --final-wait 75 &
          pid=$!
          sleep 25
          "$KUBECTL" -n ca-demo rollout restart deployment/checkout-api
          "$KUBECTL" -n ca-demo rollout status deployment/checkout-api --timeout=120s
          "$KUBECTL" -n ca-demo scale deployment/checkout-api --replicas=3
          sleep 20
          "$KUBECTL" -n ca-demo scale deployment/checkout-api --replicas=2
          wait "$pid"
          python -I tests/kind/kind_checks.py watch --out "$RUNNER_TEMP/run-watch1" --token-file "$CRED/token" --expect proven
          python -I tools/create_investigation.py --offline "$RUNNER_TEMP/run-watch1/bundle"

      - name: Install the hash-locked database driver tree
        if: steps.paths.outputs.run == 'true'
        run: |
          python -m venv .venv-db
          .venv-db/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: -r requirements-db.txt

      - name: Database-verified replay of the watch bundle (profile 3, migration 0008, its own disposable PostgreSQL)
        if: steps.paths.outputs.run == 'true'
        env:
          CA_PG_DEMO_PORT: "0"
        run: |
          set -eu
          .venv-db/bin/python -I tools/create_investigation.py "$RUNNER_TEMP/run-watch1/bundle" --json > "$RUNNER_TEMP/db-watch.json"
          python -I tests/kind/kind_checks.py db --json "$RUNNER_TEMP/db-watch.json"

      - name: "Run 1b: rule profile 2 (--ordering-rules 0.2) on the real cluster; separate session; database-verified"
        if: steps.paths.outputs.run == 'true'
        env:
          CA_PG_DEMO_PORT: "0"
        run: |
          set -eu
          c() { python -I tools/collect_k8s.py --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" --namespace ca-demo --cluster-id ca-kind-synthetic "$@"; }
          # The same recording ID as run 1 on purpose: the session identity must still differ.
          c --recording-id ca-watch-run1 --out "$RUNNER_TEMP/run-watch1b" --watch-seconds 90 --probe-interval 5 --final-wait 60 --ordering-rules 0.2 &
          pid=$!
          sleep 20
          "$KUBECTL" -n ca-demo rollout restart deployment/checkout-api
          "$KUBECTL" -n ca-demo rollout status deployment/checkout-api --timeout=120s
          wait "$pid"
          python -I tests/kind/kind_checks.py watch --out "$RUNNER_TEMP/run-watch1b" --token-file "$CRED/token" --expect proven --rule-profile 2
          python -I tests/kind/kind_checks.py sessions --out "$RUNNER_TEMP/run-watch1" --out "$RUNNER_TEMP/run-watch1b"
          python -I tools/create_investigation.py --offline "$RUNNER_TEMP/run-watch1b/bundle"
          .venv-db/bin/python -I tools/create_investigation.py "$RUNNER_TEMP/run-watch1b/bundle" --json > "$RUNNER_TEMP/db-watch1b.json"
          python -I tests/kind/kind_checks.py db --json "$RUNNER_TEMP/db-watch1b.json"

      - name: "Run 2: the API server restarts mid-session (recorded as whatever happened)"
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          c() { python -I tools/collect_k8s.py --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" --namespace ca-demo --cluster-id ca-kind-synthetic "$@"; }
          c --recording-id ca-watch-run2 --out "$RUNNER_TEMP/run-watch2" --watch-seconds 120 --probe-interval 5 --final-wait 60 --max-reconnects 10 &
          pid=$!
          sleep 25
          docker exec "$CLUSTER-control-plane" sh -c 'crictl stop $(crictl ps -q --name kube-apiserver)'
          for i in $(seq 1 60); do "$KUBECTL" get --raw /readyz >/dev/null 2>&1 && break; sleep 2; done
          "$KUBECTL" -n ca-demo scale deployment/checkout-api --replicas=3
          wait "$pid"
          python -I tests/kind/kind_checks.py watch --out "$RUNNER_TEMP/run-watch2" --token-file "$CRED/token" --expect any

      - name: "Run 3: a revoked binding ends the session as a gap"
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          c() { python -I tools/collect_k8s.py --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" --namespace ca-demo --cluster-id ca-kind-synthetic "$@"; }
          c --recording-id ca-watch-run3 --out "$RUNNER_TEMP/run-watch3" --watch-seconds 90 --probe-interval 5 --final-wait 30 --watch-timeout 15 &
          pid=$!
          sleep 25
          "$KUBECTL" -n ca-demo delete rolebinding ca-collector-watch
          wait "$pid"
          python -I tests/kind/kind_checks.py watch --out "$RUNNER_TEMP/run-watch3" --token-file "$CRED/token" --expect denied
          "$KUBECTL" apply -f deploy/kind/rbac-watch.yaml

      - name: "Run 4: the event bound ends the session as a truncated gap"
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          c() { python -I tools/collect_k8s.py --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" --namespace ca-demo --cluster-id ca-kind-synthetic "$@"; }
          c --recording-id ca-watch-run4 --out "$RUNNER_TEMP/run-watch4" --watch-seconds 60 --probe-interval 5 --final-wait 20 --max-events 3 &
          pid=$!
          sleep 15
          "$KUBECTL" -n ca-demo rollout restart deployment/checkout-api
          wait "$pid"
          python -I tests/kind/kind_checks.py watch --out "$RUNNER_TEMP/run-watch4" --token-file "$CRED/token" --expect event_limit

      - name: Delete the cluster and the credentials
        if: always() && steps.paths.outputs.run == 'true'
        run: |
          "${KIND:-kind}" delete cluster --name "${CLUSTER:-none}" || true
          rm -rf "${CRED:-/nonexistent}" "$RUNNER_TEMP"/run-watch* "$RUNNER_TEMP/db-watch.json" "$RUNNER_TEMP/db-watch1b.json"
          if docker ps --format '{{.Names}}' | grep -q "${CLUSTER:-none}"; then echo "FAIL: cluster container left behind"; exit 1; fi

  # CA-P2-004g: pod-log collection in the incident namespace of its own disposable kind cluster. The
  # collector identity gains `get pods/log` in ca-incident only (deploy/kind/rbac-incident.yaml); its
  # 30-minute token lives in a 0700 temp directory. The workload confirms each line's append to its own
  # node log file (the handshake, plan section 4.9). Not a required check.
  collector-logs-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      SA: system:serviceaccount:ca-collector:ca-collector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run only when collector or contract paths changed (or on manual dispatch)
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(src/cloud_autopsy/collector/|src/cloud_autopsy/app/(k8s_(watch_)?recording|pod_logs)\.py|src/cloud_autopsy/contracts/|src/cloud_autopsy/engine/|src/cloud_autopsy/db/migrations/|deploy/kind/|tools/collect_k8s\.py|tests/collector/|tests/kind/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Download pinned kind and kubectl and verify their SHA-256
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          bin="$RUNNER_TEMP/ca-bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum -c -
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $bin/kubectl" | sha256sum -c -
          chmod 0755 "$bin/kind" "$bin/kubectl"
          echo "KIND=$bin/kind" >> "$GITHUB_ENV"
          echo "KUBECTL=$bin/kubectl" >> "$GITHUB_ENV"
          echo "CLUSTER=ca-logs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/ca-admin.kubeconfig" >> "$GITHUB_ENV"

      - name: Create the disposable cluster (127.0.0.1 only, digest-pinned node image)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          "$KIND" create cluster --name "$CLUSTER" --config deploy/kind/cluster.yaml --wait 180s \
            || { "$KIND" delete cluster --name "$CLUSTER" || true; "$KIND" create cluster --name "$CLUSTER" --config deploy/kind/cluster.yaml --wait 180s; }
          "$KUBECTL" config view -o jsonpath='{.clusters[0].cluster.server}' | grep -Eq '^https://127\.0\.0\.1:[0-9]+$'

      - name: Synthetic incident workload (ca-incident; DB_POOL_MAX=16)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          "$KUBECTL" apply -f deploy/kind/workloads.yaml
          "$KUBECTL" create namespace ca-incident --dry-run=client -o yaml | "$KUBECTL" apply -f -
          "$KUBECTL" -n ca-incident create configmap ca-incident-workload --from-file=deploy/kind/incident_workload.py
          "$KUBECTL" apply -f deploy/kind/incident.yaml
          "$KUBECTL" -n ca-incident rollout status deployment/checkout-api --timeout=240s
          "$KUBECTL" -n ca-incident get deployments,replicasets,pods -o wide

      - name: Incident collector identity (pods/log in ca-incident only) and a 30-minute token outside Git
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/ca-collector-cred.XXXXXX")"
          "$KUBECTL" apply -f deploy/kind/rbac-incident.yaml
          "$KUBECTL" create token ca-collector -n ca-collector --duration=30m > "$dir/token"
          echo "::add-mask::$(cat "$dir/token")"
          "$KUBECTL" config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "$dir/ca.crt"
          echo "CRED=$dir" >> "$GITHUB_ENV"
          echo "SERVER=$("$KUBECTL" config view -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_ENV"
          test "$(stat -c '%a' "$dir")" = 700 && test "$(stat -c '%a' "$dir/token")" = 600

      - name: Negative RBAC (kubectl auth can-i as the collector)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          no() { out="$("$KUBECTL" auth can-i "$@" --as="$SA" 2>/dev/null || true)"; [ "$out" = "no" ] || { echo "FAIL: can-i $* -> $out"; exit 1; }; }
          yes() { out="$("$KUBECTL" auth can-i "$@" --as="$SA" 2>/dev/null || true)"; [ "$out" = "yes" ] || { echo "FAIL: can-i $* -> $out"; exit 1; }; }
          for r in pods events deployments.apps replicasets.apps; do yes list "$r" -n ca-incident; yes watch "$r" -n ca-incident; done
          yes get pods -n ca-incident --subresource=log
          for ns in ca-demo ca-other kube-system default; do no get pods -n "$ns" --subresource=log; done
          for ns in ca-incident ca-demo; do for r in secrets configmaps; do no get "$r" -n "$ns"; no list "$r" -n "$ns"; no watch "$r" -n "$ns"; done; done
          for s in exec attach portforward; do no create pods -n ca-incident --subresource="$s"; done
          no get pods -n ca-incident --subresource=proxy
          no patch pods -n ca-incident --subresource=ephemeralcontainers
          no create pods -n ca-incident --subresource=eviction
          for v in create update patch delete deletecollection; do
            no "$v" pods -n ca-incident; no "$v" deployments.apps -n ca-incident; no "$v" replicasets.apps -n ca-incident
          done
          no list nodes
          no get namespaces
          no list pods --all-namespaces
          no create serviceaccounts/token -n ca-collector
          echo "can-i: list/watch and pods/log in ca-incident are 'yes'; every other verb, subresource, namespace and scope is 'no'"

      - name: Negative RBAC with the real token (raw requests must get 403; pods/log in ca-incident 200)
        if: steps.paths.outputs.run == 'true'
        run: python -I tests/kind/kind_checks.py rbac-incident --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token"

      - name: "Logs run: lower DB_POOL_MAX 16 -> 4 by rollout while the collector follows pod logs"
        if: steps.paths.outputs.run == 'true'
        run: |
          set -eu
          python -I tools/collect_k8s.py --server "$SERVER" --ca-file "$CRED/ca.crt" --token-file "$CRED/token" \
            --namespace ca-incident --cluster-id ca-kind-synthetic --recording-id ca-logs-run1 --out "$RUNNER_TEMP/run-logs1" \
            --watch-seconds 150 --probe-interval 5 --final-wait 60 --ordering-rules 0.2 \
            --pod-logs --declare-limit checkout-api:DB_POOL_MAX:pool.maxConnections &
          pid=$!
          sleep 25
          "$KUBECTL" -n ca-incident set env deployment/checkout-api DB_POOL_MAX=4
          "$KUBECTL" -n ca-incident rollout status deployment/checkout-api --timeout=180s
          wait "$pid"
          python -I tests/kind/kind_checks.py logs --out "$RUNNER_TEMP/run-logs1" --token-file "$CRED/token" --expect-ordered
          python -I tools/create_investigation.py --offline "$RUNNER_TEMP/run-logs1/bundle"

      - name: Install the hash-locked database driver tree
        if: steps.paths.outputs.run == 'true'
        run: |
          python -m venv .venv-db
          .venv-db/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: -r requirements-db.txt

      - name: Database-verified replay of the pod-log bundle (profile 4, migration 0009, its own disposable PostgreSQL)
        if: steps.paths.outputs.run == 'true'
        env:
          CA_PG_DEMO_PORT: "0"
        run: |
          set -eu
          .venv-db/bin/python -I tools/create_investigation.py "$RUNNER_TEMP/run-logs1/bundle" --json > "$RUNNER_TEMP/db-logs.json"
          python -I tests/kind/kind_checks.py db --json "$RUNNER_TEMP/db-logs.json"

      - name: Delete the cluster and the credentials
        if: always() && steps.paths.outputs.run == 'true'
        run: |
          "${KIND:-kind}" delete cluster --name "${CLUSTER:-none}" || true
          rm -rf "${CRED:-/nonexistent}" "$RUNNER_TEMP"/run-logs* "$RUNNER_TEMP/db-logs.json"
          if docker ps --format '{{.Names}}' | grep -q "${CLUSTER:-none}"; then echo "FAIL: cluster container left behind"; exit 1; fi
