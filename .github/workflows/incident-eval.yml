# CA-P2-007a: developer-set evaluation of the synthetic incident milestone on disposable kind clusters.
# Runs only when a branch named eval/ca-p2-007a-run-* is pushed; that branch's commit is the frozen baseline.
# One sequential job: every repetition gets its own fresh cluster, created and deleted around it; no parallel runs.
# Every attempt is recorded and scored (tools/eval); nothing is retried or dropped. Synthetic data only.
name: incident-eval

on:
  push:
    branches: ["eval/ca-p2-007a-run-*"]

permissions:
  contents: read

jobs:
  incident-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      CA_PG_DEMO_PORT: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Download pinned kind and kubectl and verify their SHA-256
        run: |
          set -eu
          bin="$RUNNER_TEMP/ca-bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum -c -
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $bin/kubectl" | sha256sum -c -
          chmod 0755 "$bin/kind" "$bin/kubectl"
          echo "KIND=$bin/kind" >> "$GITHUB_ENV"
          echo "KUBECTL=$bin/kubectl" >> "$GITHUB_ENV"

      - name: Install the hash-locked database driver tree
        run: |
          python -m venv .venv-db
          .venv-db/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: -r requirements-db.txt

      - name: Record the frozen baseline
        run: |
          set -eu
          {
            echo "## CA-P2-007a baseline"
            echo "- commit: \`$GITHUB_SHA\` (ref \`$GITHUB_REF_NAME\`)"
            echo "- scenario file: \`$(python -I tools/eval/scenario.py digest)\`"
            echo "- kind ${KIND_VERSION}, kubectl ${KUBECTL_VERSION}, node image: \`$(grep -o 'image: .*' deploy/kind/cluster.yaml | head -1)\`"
            echo "- workload image: \`$(grep -o 'image: docker.io/library/python[^ ]*' deploy/kind/incident.yaml)\`"
            echo "- python $(python -c 'import platform; print(platform.python_version())'); runner $(uname -sr)"
            echo "- engine, catalog and rule versions: \`$(python -I -c 'import sys; sys.path.insert(0, "src"); from cloud_autopsy.engine import required_rule_versions as r; print(r(3))')\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run every frozen repetition (fresh cluster each; sequential; nothing retried)
        run: |
          set -u
          records="$RUNNER_TEMP/records"
          mkdir -p "$records"
          python -I tools/eval/scenario.py order > "$RUNNER_TEMP/order.txt"
          while read -r sc rep; do
            echo "::group::$sc repetition $rep"
            started=$(date +%s)
            bash tools/eval/run_rep.sh "$sc" "$rep" "$records"
            echo "took $(( $(date +%s) - started )) s"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/order.txt"
          echo "RECORDS=$records" >> "$GITHUB_ENV"

      - name: Score against the frozen truth and thresholds
        run: |
          set -u
          for f in "$RECORDS"/*.json; do echo "=== $(basename "$f")"; cat "$f"; done
          python -I tools/eval/score.py "$RECORDS" --json "$RUNNER_TEMP/report.json" --markdown "$RUNNER_TEMP/report.md"
          status=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Delete any leftover cluster
        if: always()
        run: |
          for c in $("${KIND:-kind}" get clusters 2>/dev/null); do "${KIND:-kind}" delete cluster --name "$c" || true; done
